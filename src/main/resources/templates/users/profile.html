<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('프로필')}"><title>프로필</title></head>
<body class="interior-page profile-page">
<header th:replace="~{fragments/common :: header}"></header>
<main class="container py-5">
    <section class="d-flex align-items-center gap-3 mb-4"><span class="avatar fs-3" style="width:4rem;height:4rem"
                                                                th:text="${#strings.substring(user.nickname,0,1)}">복</span>
        <div>
            <div class="page-label">PROFILE</div>
            <h1 class="h2 fw-black mb-1" th:text="${user.nickname}">복학생A</h1>
            <p class="text-secondary mb-0" th:text="${user.bio}">한 글자씩 웃음을 만드는 중</p></div>
    </section>
    <div class="row g-3 mb-4">
        <div class="col-4">
            <div class="card text-center">
                <div class="card-body"><strong class="fs-4" th:text="${user.poemCount}">18</strong>
                    <div class="small text-secondary">작성 작품</div>
                </div>
            </div>
        </div>
        <div class="col-4">
            <div class="card text-center">
                <div class="card-body"><strong class="fs-4" th:text="${user.averageRating}">4.7</strong>
                    <div class="small text-secondary">평균 별점</div>
                </div>
            </div>
        </div>
        <div class="col-4">
            <div class="card text-center">
                <div class="card-body"><strong class="fs-4" th:text="${user.ratingCount}">1204</strong>
                    <div class="small text-secondary">총 평가</div>
                </div>
            </div>
        </div>
    </div>
    <h2 class="h4 fw-bold">작성한 N행시</h2>
    <div class="row g-3">
        <div class="col-md-6" th:each="poem : ${poems}">
            <div class="card poem-card h-100">
                <div class="card-body"><h3 class="h5" th:text="${poem.word}">대학교</h3><a class="stretched-link"
                                                                                        th:href="@{/poems/{id}(id=${poem.id})}"><span
                        class="visually-hidden">상세 보기</span></a></div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
