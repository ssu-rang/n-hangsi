<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('로그인')}"><title>로그인</title></head>
<body>
<main class="container d-grid align-items-center min-vh-100 py-4">
    <section class="card shadow-sm mx-auto w-100" style="max-width:430px">
        <div class="card-body p-4 p-lg-5"><a class="navbar-brand fw-black d-flex align-items-center gap-2 mb-4"
                                             th:href="@{/}" href="../home.html"><span class="brand-mark">N</span>N행시</a>
            <div class="page-label">WELCOME BACK</div>
            <h1 class="h3 fw-black mb-4">다시 만나서 반가워요</h1>
            <div class="alert alert-danger" th:if="${param.error}">이메일 또는 비밀번호를 확인해 주세요.</div>
            <form method="post" th:action="@{/login}">
                <div class="mb-3"><label for="username" class="form-label">이메일</label><input id="username"
                                                                                             name="username"
                                                                                             type="email"
                                                                                             class="form-control"
                                                                                             required
                                                                                             autocomplete="username">
                </div>
                <div class="mb-4"><label for="password" class="form-label">비밀번호</label><input id="password"
                                                                                              name="password"
                                                                                              type="password"
                                                                                              class="form-control"
                                                                                              required
                                                                                              autocomplete="current-password">
                </div>
                <button class="btn btn-primary w-100">로그인</button>
            </form>
        </div>
    </section>
</main>
<div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
