<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('홈')}"><meta charset="UTF-8"><title>N행시</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../static/css/app.css"></head>
<body><header th:replace="~{fragments/common :: header}"></header>
<main class="container py-4 py-lg-5">
  <section class="hero p-4 p-lg-5 mb-5"><div class="row align-items-center g-4"><div class="col-lg-7"><div class="small opacity-75 mb-2">오늘의 단어 · 8월 15일</div><h1 class="display-4 fw-black">아르바이트</h1><p class="lead opacity-75">오늘의 제시어로 재치 있는 N행시를 남겨보세요.</p><div class="d-flex flex-wrap gap-2"><a class="btn btn-light text-primary fw-bold" th:href="@{/poems/new(word='아르바이트')}" href="poems/write.html">N행시 쓰기</a><a class="btn btn-outline-light" th:href="@{/poems}" href="poems/list.html">작품 둘러보기</a></div></div><div class="col-lg-5"><div class="card border-0 shadow-sm"><div class="card-body text-dark"><div class="small text-secondary mb-3">오늘의 인기 작품</div><div class="poem-line"><strong>아</strong><span>아직 퇴근은 멀었고</span></div><div class="poem-line"><strong>르</strong><span>르포를 쓰듯 일했다</span></div></div></div></div></div></section>
  <div class="d-flex justify-content-between align-items-end mb-3"><div><div class="page-label">TRENDING</div><h2 class="section-title mb-0">지금 인기 있는 N행시</h2></div><a th:href="@{/poems}" href="poems/list.html">전체 보기</a></div>
  <div class="row g-3" th:if="${poems == null or !poems.isEmpty()}">
    <div class="col-12 col-md-6" th:each="poem : ${poems}"><article class="card poem-card h-100 shadow-sm"><div class="card-body"><div class="page-label">N행시</div><h3 class="h4 fw-bold" th:text="${poem.word}">대학교</h3><div class="my-3" th:each="line, stat : ${poem.lines}"><div class="poem-line"><strong th:text="${#strings.substring(poem.word, stat.index, stat.index + 1)}">대</strong><span th:text="${line}">대충 살자고 했는데</span></div></div><div class="d-flex justify-content-between text-secondary small"><span th:text="${poem.authorName}">@복학생A</span><span class="rating" th:text="|★ ${poem.rating}|">★ 4.8</span></div><a class="stretched-link" th:href="@{/poems/{id}(id=${poem.id})}" href="poems/detail.html"><span class="visually-hidden">상세 보기</span></a></div></article></div>
    <div class="col-12 col-md-6" th:if="${poems == null}"><article class="card poem-card h-100 shadow-sm"><div class="card-body"><div class="page-label">N행시</div><h3 class="h4 fw-bold">대학교</h3><div class="my-3"><div class="poem-line"><strong>대</strong><span>대충 살자고 했는데</span></div><div class="poem-line"><strong>학</strong><span>학점은 왜</span></div><div class="poem-line"><strong>교</strong><span>교수님 마음대로인가요</span></div></div><div class="d-flex justify-content-between small"><span>@복학생A</span><span class="rating">★ 4.8</span></div></div></article></div>
  </div>
</main><footer th:replace="~{fragments/common :: footer}"></footer><div th:replace="~{fragments/common :: scripts}"></div></body></html>
