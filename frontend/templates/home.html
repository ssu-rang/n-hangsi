<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('홈')}">
    <meta charset="UTF-8">
    <title>N행시</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
<header th:replace="~{fragments/common :: header}"></header>
<main class="home-container py-4 py-lg-5"
      th:with="availablePoems=${poems != null ? poems : {}}, lineFilter=${param.lines != null ? param.lines[0] : 'all'}, filteredPoems=${lineFilter == '2' ? availablePoems.?[word.length() == 2] : lineFilter == '3' ? availablePoems.?[word.length() == 3] : lineFilter == '4' ? availablePoems.?[word.length() == 4] : lineFilter == '5plus' ? availablePoems.?[word.length() >= 5] : availablePoems}">
    <div class="home-layout">
        <aside class="category-sidebar" aria-label="N행시 카테고리">
            <h2>카테고리</h2>
            <div class="filter-group">
                <h3>행 수</h3>
                <nav>
                    <a th:href="@{/}" href="home.html" th:classappend="${lineFilter == 'all' ? 'is-active' : ''}"
                       th:attr="aria-current=${lineFilter == 'all' ? 'page' : null}">전체</a>
                    <a th:href="@{/(lines='2')}" href="?lines=2" th:classappend="${lineFilter == '2' ? 'is-active' : ''}"
                       th:attr="aria-current=${lineFilter == '2' ? 'page' : null}">2행시</a>
                    <a th:href="@{/(lines='3')}" href="?lines=3" th:classappend="${lineFilter == '3' ? 'is-active' : ''}"
                       th:attr="aria-current=${lineFilter == '3' ? 'page' : null}">3행시</a>
                    <a th:href="@{/(lines='4')}" href="?lines=4" th:classappend="${lineFilter == '4' ? 'is-active' : ''}"
                       th:attr="aria-current=${lineFilter == '4' ? 'page' : null}">4행시</a>
                    <a th:href="@{/(lines='5plus')}" href="?lines=5plus"
                       th:classappend="${lineFilter == '5plus' ? 'is-active' : ''}"
                       th:attr="aria-current=${lineFilter == '5plus' ? 'page' : null}">5행시 이상</a>
                </nav>
            </div>
            <div class="filter-group difficulty-filter">
                <h3>난이도</h3>
                <nav aria-label="난이도 필터 준비 중">
                    <span aria-disabled="true">전체</span><span aria-disabled="true">쉬움</span><span aria-disabled="true">보통</span><span
                        aria-disabled="true">어려움</span>
                </nav>
            </div>
        </aside>
        <div class="main-content">
    <section class="daily-overview">
        <div class="daily-prompt">
            <div class="daily-prompt-label">오늘의 제시어</div>
            <h1>파란하늘</h1>
            <p class="text-secondary">오늘의 단어로 N행시를 지어보세요.</p>
            <a class="btn btn-light text-primary fw-bold" th:href="@{/poems/new(word='파란하늘')}"
               href="poems/write.html">N행시 쓰기</a>
        </div>
        <div class="daily-recommendation"
             th:with="recommended=${!availablePoems.isEmpty() ? availablePoems[0] : null}">
            <div class="daily-recommendation-label">오늘의 추천 작품</div>
            <div th:if="${recommended != null}">
                <div class="poem-line" th:each="line, stat : ${recommended.lines}"><strong
                        th:text="${#strings.substring(recommended.word, stat.index, stat.index + 1)}">첫</strong><span
                        th:text="${line}">추천 작품의 문장</span></div>
                <div class="meta recommendation-meta"><span><span
                        th:text="|@${recommended.authorName} · 평점 ${recommended.rating} · 댓글 ${recommended.commentCount}|">@작성자 · 평점 - · 댓글 -</span><span
                        th:if="${recommended.createdAt != null}" th:text="| · ${recommended.createdAt}|"> · 작성일</span></span></div>
            </div>
            <p class="text-secondary mb-0" th:if="${recommended == null}">아직 추천할 작품이 없습니다.</p>
        </div>
    </section>
    <div class="d-flex justify-content-between align-items-end mb-3 home-section-head">
        <h2 class="section-title mb-0">지금 인기 있는 N행시</h2>
        <a th:href="@{/poems}" href="poems/list.html">전체 보기</a></div>
    <div class="trending-list">
        <div th:each="poem, stat : ${filteredPoems}">
            <article class="card poem-card h-100 shadow-sm">
                <div class="card-body">
                    <div class="community-heading"><span class="community-rank" th:text="|#${stat.count}|">#1</span>
                        <h3 class="h4 fw-bold" th:text="${poem.word}">대학교</h3><span class="hot-label"
                                th:if="${stat.first}">HOT</span><span class="line-count"
                                th:text="|${#strings.length(poem.word)}행시|">3행시</span></div>
                    <div th:each="line, stat : ${poem.lines}">
                        <div class="poem-line"><strong
                                th:text="${#strings.substring(poem.word, stat.index, stat.index + 1)}">대</strong><span
                                th:text="${line}">대충 살자고 했는데</span></div>
                    </div>
                    <div class="meta"><span><span
                            th:text="|@${poem.authorName} · 평점 ${poem.rating} · 댓글 ${poem.commentCount}|">@작성자 · 평점 - · 댓글 -</span><span
                            th:if="${poem.createdAt != null}" th:text="| · ${poem.createdAt}|"> · 작성일</span></span></div>
                    <a class="stretched-link" th:href="@{/poems/{id}(id=${poem.id})}" href="poems/detail.html"><span
                            class="visually-hidden">상세 보기</span></a></div>
            </article>
        </div>
        <p class="empty" th:if="${filteredPoems.isEmpty()}">조건에 맞는 작품이 없습니다.</p>
    </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
