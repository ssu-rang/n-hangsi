<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('글쓰기')}"><title>글쓰기</title></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>
<main class="container py-5" style="max-width: 800px">
    <div class="page-label">CREATE</div>
    <h1 class="section-title">한 글자씩 이어볼까요?</h1>
    <p class="text-secondary mb-4">완벽하지 않아도 괜찮아요. 짧고 솔직하게 작성해 보세요.</p>
    <form class="card shadow-sm write-card" method="post" th:action="@{/poems}" th:object="${poemForm}">
        <div class="card-body p-4 p-lg-5"><label for="word" class="form-label fw-bold">제시어</label><input id="word"
                                                                                                         data-poem-word
                                                                                                         class="form-control form-control-lg"
                                                                                                         name="word"
                                                                                                         th:field="*{word}"
                                                                                                         th:value="${param.word}"
                                                                                                         minlength="2"
                                                                                                         maxlength="6"
                                                                                                         required
                                                                                                         placeholder="2~6글자 단어">
            <div data-poem-preview class="form-text mb-4">제시어를 입력하세요.</div>
            <div data-poem-lines></div>
            <div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" th:href="@{/}"
                                                                  href="../home.html">취소</a>
                <button class="btn btn-primary" type="submit">등록하기</button>
            </div>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
