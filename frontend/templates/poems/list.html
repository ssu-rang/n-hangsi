<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('둘러보기')}"><title>둘러보기</title></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>
<main class="container py-5">
    <div class="page-label">EXPLORE</div>
    <h1 class="section-title">웃음 찾기</h1>
    <p class="text-secondary mb-4">단어나 문장으로 취향에 맞는 N행시를 찾아보세요.</p>
    <form class="row g-2 mb-4 explore-search" method="get" th:action="@{/poems}">
        <div class="col"><label class="visually-hidden" for="keyword">검색어</label><input id="keyword"
                                                                                        class="form-control form-control-lg"
                                                                                        name="keyword"
                                                                                        th:value="${keyword}"
                                                                                        placeholder="단어 또는 내용 검색"></div>
        <div class="col-auto">
            <button class="btn btn-primary btn-lg">검색</button>
        </div>
    </form>
    <div class="row g-3 explore-grid">
        <div class="col-12" th:each="poem : ${poems}">
            <article class="card poem-card shadow-sm">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h2 class="h4 fw-bold" th:text="${poem.word}">고양이</h2></div>
                        <span class="rating" th:text="|★ ${poem.rating}|">★ 4.6</span></div>
                    <div class="poem-line" th:each="line, stat : ${poem.lines}"><strong
                            th:text="${#strings.substring(poem.word, stat.index, stat.index + 1)}">고</strong><span
                            th:text="${line}">고민은 잠시 내려놓고</span></div>
                    <a class="stretched-link" th:href="@{/poems/{id}(id=${poem.id})}" href="detail.html"><span
                            class="visually-hidden">상세 보기</span></a></div>
            </article>
        </div>
    </div>
    <div class="empty-state" th:if="${poems != null and poems.isEmpty()}"><h2>검색 결과가 없습니다</h2>
        <p class="text-secondary">다른 검색어를 입력해 보세요.</p></div>
</main>
<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
